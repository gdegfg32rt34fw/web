<svg width="560" height="360" viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Layered celebration cake</title>
  <desc id="desc">Tall celebration cake with saffron and pistachio layers topped with roses.</desc>
  <defs>
    <linearGradient id="cakeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2e4" />
      <stop offset="100%" stop-color="#f4d0aa" />
    </linearGradient>
    <linearGradient id="cakeLayer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7b35a" />
      <stop offset="100%" stop-color="#e8843e" />
    </linearGradient>
    <linearGradient id="pistachioLayer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8d8a4" />
      <stop offset="100%" stop-color="#8fa873" />
    </linearGradient>
  </defs>
  <rect width="560" height="360" rx="40" fill="url(#cakeBg)" />
  <g>
    <rect x="160" y="220" width="240" height="60" rx="24" fill="url(#cakeLayer)" />
    <rect x="170" y="160" width="220" height="60" rx="24" fill="#fff0db" />
    <rect x="180" y="110" width="200" height="50" rx="20" fill="url(#pistachioLayer)" />
    <rect x="195" y="70" width="170" height="40" rx="18" fill="#f9e7ce" />
  </g>
  <g fill="#e8a5b7">
    <circle cx="220" cy="80" r="18" />
    <circle cx="280" cy="70" r="20" />
    <circle cx="340" cy="82" r="18" />
  </g>
  <g stroke="#fdf7ee" stroke-width="4" stroke-linecap="round">
    <line x1="220" y1="60" x2="220" y2="20" />
    <line x1="280" y1="50" x2="280" y2="10" />
    <line x1="340" y1="60" x2="340" y2="20" />
  </g>
  <g stroke="#f4b55a" stroke-width="6" stroke-linecap="round">
    <line x1="220" y1="22" x2="220" y2="18" />
    <line x1="280" y1="12" x2="280" y2="8" />
    <line x1="340" y1="22" x2="340" y2="18" />
  </g>
</svg>
