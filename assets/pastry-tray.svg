<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Close-up of cream-filled Persian pastries</title>
  <desc id="desc">Colorful custard pastries with pistachio and rose decorations on a marble counter.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef6ee" />
      <stop offset="100%" stop-color="#f4d3ae" />
    </linearGradient>
    <radialGradient id="marble" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f2e0cc" stop-opacity="0.9" />
    </radialGradient>
    <linearGradient id="pastryCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3d9" />
      <stop offset="100%" stop-color="#f7dfb5" />
    </linearGradient>
    <linearGradient id="saffron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7b54c" />
      <stop offset="100%" stop-color="#d86f30" />
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7b4c4" />
      <stop offset="100%" stop-color="#c96a84" />
    </linearGradient>
    <linearGradient id="pistachio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbdcaa" />
      <stop offset="100%" stop-color="#8ea276" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
  </defs>
  <rect width="900" height="600" fill="url(#background)" />
  <rect width="900" height="600" fill="url(#marble)" opacity="0.8" />
  <g opacity="0.8" filter="url(#blur)">
    <ellipse cx="300" cy="480" rx="220" ry="80" fill="#bfa896" />
    <ellipse cx="600" cy="460" rx="220" ry="78" fill="#c3ac98" />
  </g>
  <g>
    <ellipse cx="270" cy="320" rx="180" ry="120" fill="url(#pastryCream)" />
    <ellipse cx="270" cy="320" rx="130" ry="70" fill="url(#saffron)" opacity="0.7" />
    <ellipse cx="250" cy="300" rx="60" ry="40" fill="#fff7eb" />
    <circle cx="200" cy="250" r="14" fill="#7da05f" />
    <circle cx="225" cy="250" r="10" fill="#efe5d4" />
  </g>
  <g>
    <ellipse cx="470" cy="320" rx="180" ry="118" fill="url(#pastryCream)" />
    <ellipse cx="470" cy="320" rx="130" ry="72" fill="url(#rose)" opacity="0.75" />
    <ellipse cx="480" cy="300" rx="58" ry="38" fill="#fff3e1" />
    <circle cx="520" cy="250" r="14" fill="#d08d9e" />
    <circle cx="495" cy="245" r="9" fill="#f5e8db" />
  </g>
  <g>
    <ellipse cx="670" cy="320" rx="182" ry="120" fill="url(#pastryCream)" />
    <ellipse cx="670" cy="320" rx="135" ry="70" fill="url(#pistachio)" opacity="0.75" />
    <ellipse cx="650" cy="300" rx="58" ry="38" fill="#fff4df" />
    <circle cx="600" cy="250" r="13" fill="#88a06b" />
    <circle cx="625" cy="240" r="10" fill="#f0e4d2" />
  </g>
</svg>
